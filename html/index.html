<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro Mejorado</title>
    <link rel="stylesheet" href="/css/styles.css"> <!-- Enlazar el archivo CSS -->
</head>
<body>
    <!-- Usamos un contenedor principal para centrar y delimitar el formulario -->
    <main class="container">
        <header>
            <h1>Registro de Usuario</h1>
            <p>Por favor, completa tus datos para continuar.</p>
        </header>
        
        <!-- El <form> se usa para encapsular toda la interacción -->
        <form id="registrationForm" action="/submit-form" method="POST">
            
            <!-- Se agrupan elementos relacionados con <fieldset> y <legend> -->
            <fieldset>
                <legend>Datos Personales</legend>
                
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido" required>
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>
            </fieldset>
            <fieldset>
                <legend>Información Adicional</legend>
                <div class="form-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono">
                </div>
                <div class="form-group">
                    <label for="edad">Edad:</label>
                    <!-- El type="number" con atributos min/max mejora la validación nativa del navegador -->
                    <input type="number" id="edad" name="edad" min="1" max="120">
                </div>
            </fieldset>
            <!-- Botón de envío semánticamente marcado -->
            <button type="submit" class="submit-btn">Registrarse</button>
        </form>
    </main>
</body>
</html>
